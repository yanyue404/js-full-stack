<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 06 · AI 调用的重试、降级与上下文</title>
<style>
:root{--a:#2563eb;--bg:#f7f7f8;--fg:#1f2328;--mut:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:900px;margin:0 auto;padding:24px 16px 64px}
a{color:var(--a)}
h1{margin:8px 0 6px;font-size:24px}
h2{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);letter-spacing:.05em;margin:0 0 10px}
h2 button{margin:0 0 0 auto}
.q{color:var(--mut);margin:4px 0}
section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:10px}
.f{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.f b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.changed{border-color:var(--a)!important;background:#eff6ff}
.note{margin:12px 0 0;padding:8px 12px;border-left:3px solid var(--a);background:#f8fafc}
button{font:inherit;font-size:14px;padding:6px 12px;margin:0 6px 6px 0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
button:hover:not(:disabled){border-color:var(--a);color:var(--a)}
button:disabled{opacity:.4;cursor:default}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a)}
.steps button.next{border-color:var(--a);color:var(--a);font-weight:600}
.steps button.done{text-decoration:line-through}
.ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#b45309}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
th{color:var(--mut);font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<main>
  <a href="index.html">← 全部原型</a>
  <h1>第六讲 · AI 调用的重试、模型降级、工具调用与上下文裁剪</h1>
  <p class="q"><b>要回答的问题：</b>一次 AI 请求在"主模型限流""主模型宕机""全部宕机"时分别会走哪条路？哪些错误值得重试、何时切到备用模型、何时直接给兜底文案？多轮对话超出上下文预算时丢掉哪些消息？</p>
  <p class="q">PROTOTYPE · 一次性演示，不调用真实模型。对应真实实现见 <code>demos/06-ai-chat/api/src/ai</code>（<code>withRetry</code> + <code>getModelChain</code>）。</p>

  <section><h2>当前状态</h2><div id="state"></div><p class="note" id="note"></p></section>
  <section><h2>自由试玩 <button id="reset">重置</button></h2><div id="free"></div></section>
  <section><h2>引导式演练</h2><div class="tabs" id="tabs"></div><p id="desc"></p><div class="steps" id="steps"></div></section>
</main>

<!-- ① 纯逻辑模块 -->
<script>
const MAX_RETRIES = 2
const BASE_DELAY = 800
const CONTEXT_BUDGET = 60 // 演示用的小预算（token ≈ 字数）
const SYSTEM = { role: 'system', content: '你是产品助手，回答简洁。' }
const RETRYABLE = ['429', '500']

const tokens = (m) => m.content.length

const AiModel = {
  init: () => ({
    models: [
      { id: 'gpt-4o-mini', health: 'ok' },
      { id: 'claude-sonnet', health: 'ok' }
    ],
    history: [],
    trace: [],
    note: ''
  }),

  /** 保留 system，按整轮（问 + 答）从最早开始丢弃，直到总量不超预算 */
  fitContext(history, userMsg) {
    const kept = [...history, userMsg]
    let dropped = 0
    while (tokens(SYSTEM) + kept.reduce((n, m) => n + tokens(m), 0) > CONTEXT_BUDGET && kept.length > 1) {
      kept.shift()
      dropped++
      if (kept[0]?.role === 'assistant') { kept.shift(); dropped++ }
    }
    return { kept, dropped }
  },

  reduce(state, a) {
    const s = structuredClone(state)
    if (a.type === 'health') {
      s.models[a.index].health = a.health
      s.note = `${s.models[a.index].id} 状态设为「${HEALTH[a.health]}」`
      return s
    }
    if (a.type !== 'ask') return state

    const trace = []
    const user = { role: 'user', content: a.q }
    const { kept, dropped } = AiModel.fitContext(s.history, user)
    trace.push(`组装上下文：system + ${kept.length} 条消息${dropped ? `（超出 ${CONTEXT_BUDGET} token 预算，丢弃最早的 ${dropped} 条）` : ''}`)

    let answer = null
    let usedModel = null
    outer: for (const m of s.models) {
      for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
        if (m.health === 'ok') {
          trace.push(`✓ ${m.id} 第 ${attempt + 1} 次调用成功`)
          usedModel = m.id
          break outer
        }
        const retryable = RETRYABLE.includes(m.health)
        trace.push(`✗ ${m.id} 第 ${attempt + 1} 次调用：${HEALTH[m.health]}`)
        if (!retryable) { trace.push(`  400 类错误重试也没用，直接换模型`); break }
        if (attempt < MAX_RETRIES) trace.push(`  可重试，等待 ${BASE_DELAY * 2 ** attempt}ms（指数退避）`)
      }
      trace.push(`→ ${m.id} 放弃，尝试降级链中的下一个模型`)
    }

    if (usedModel && a.tool) {
      trace.push(`模型返回 tool_call：getWeather({ city: "上海" })`)
      trace.push(`服务端执行工具 → { temp: 22, weather: "多云" }`)
      trace.push(`把工具结果作为 tool 消息回传，模型生成最终回答`)
      answer = '上海今天多云，22°C，适合出门。'
    } else if (usedModel) {
      answer = a.answer
    } else {
      trace.push('所有模型都失败 → 返回兜底文案，并记录告警')
      answer = '抱歉，AI 助手暂时繁忙，请稍后再试或联系人工客服。'
    }

    s.history = [...kept, { role: 'assistant', content: answer, model: usedModel ?? '兜底' }]
    s.trace = trace
    s.note = usedModel ? `由 ${usedModel} 回答` : '⚠️ 全部模型失败，用户看到的是兜底文案（而不是报错页面）'
    return s
  }
}
const HEALTH = { ok: '正常', 429: '429 限流', 500: '500 服务异常', 400: '400 请求非法' }
const Model = AiModel
</script>

<!-- ② 页面配置 -->
<script>
const ACTIONS = [
  { label: '问：上海今天天气？（需要工具）', action: { type: 'ask', q: '上海今天天气怎么样？', tool: true } },
  { label: '问：写一句产品 slogan', action: { type: 'ask', q: '帮我给记账 App 写一句 slogan', answer: '每一笔，都算数。' } },
  { label: '问：再短一点', action: { type: 'ask', q: '再短一点', answer: '笔笔算数。' } },
  { label: '主模型：正常', action: { type: 'health', index: 0, health: 'ok' } },
  { label: '主模型：429 限流', action: { type: 'health', index: 0, health: '429' } },
  { label: '主模型：400 非法请求', action: { type: 'health', index: 0, health: '400' } },
  { label: '备用模型：正常', action: { type: 'health', index: 1, health: 'ok' } },
  { label: '备用模型：500 异常', action: { type: 'health', index: 1, health: '500' } }
]
const A = Object.fromEntries(ACTIONS.map((a) => [a.label, a.action]))
const SCENARIOS = [
  { name: '工具调用', desc: '模型自己不知道今天的天气，它返回一个"调用 getWeather"的请求，由服务端执行后把结果喂回去，再生成回答。', steps: ['问：上海今天天气？（需要工具）'] },
  { name: '限流 → 降级', desc: '主模型持续 429：重试 2 次（指数退避）仍失败，切换到备用模型。用户只感觉慢了一点。', steps: ['主模型：429 限流', '问：写一句产品 slogan'] },
  { name: '非重试错误', desc: '400 是请求本身有问题，重试只会浪费钱和时间——直接切到下一个模型。', steps: ['主模型：400 非法请求', '问：写一句产品 slogan'] },
  { name: '全部失败', desc: '两个模型都不可用时，返回预先准备的兜底文案，而不是把异常抛给前端。', steps: ['主模型：429 限流', '备用模型：500 异常', '问：写一句产品 slogan'] },
  { name: '上下文裁剪', desc: `预算只有 ${CONTEXT_BUDGET} token。多问几轮后，最早的一整轮（问 + 答）被丢弃，system 提示永远保留。"再短一点"这类追问依赖上文——被裁掉的轮次模型就再也看不到了，这就是需要"摘要记忆"的原因。`, steps: ['问：写一句产品 slogan', '问：再短一点', '问：上海今天天气？（需要工具）', '问：再短一点'] }
].map((s) => ({ ...s, steps: s.steps.map((label) => ({ label, action: A[label] })) }))

function VIEW(s, p) {
  const used = tokens(SYSTEM) + s.history.reduce((n, m) => n + tokens(m), 0)
  const pused = tokens(SYSTEM) + p.history.reduce((n, m) => n + tokens(m), 0)
  return `<div class="grid">
    ${s.models.map((m, i) => field(`${i === 0 ? '主模型' : '备用模型'} ${m.id}`, m.health === 'ok' ? `<span class="ok">${HEALTH[m.health]}</span>` : `<span class="bad">${HEALTH[m.health]}</span>`, p.models[i].health === 'ok' ? `<span class="ok">${HEALTH.ok}</span>` : `<span class="bad">${HEALTH[p.models[i].health]}</span>`)).join('')}
    ${field('上下文占用', `${used} / ${CONTEXT_BUDGET} token`, `${pused} / ${CONTEXT_BUDGET} token`)}
    ${field('对话消息数', s.history.length, p.history.length)}
  </div>
  <div class="cols">
    <table><tr><th colspan="2">发送给模型的上下文</th></tr>
      <tr><td>system</td><td class="q">${SYSTEM.content}</td></tr>
      ${s.history.map((m) => `<tr><td>${m.role}${m.model ? `<br><small class="q">${m.model}</small>` : ''}</td><td>${m.content}</td></tr>`).join('')}
    </table>
    <table><tr><th>最近一次请求的执行轨迹</th></tr>
      ${s.trace.map((t) => `<tr><td class="${t.startsWith('✓') ? 'ok' : t.startsWith('✗') ? 'bad' : ''}">${t}</td></tr>`).join('') || '<tr><td class="q">还没有发送过问题</td></tr>'}
    </table>
  </div>`
}
</script>

<!-- ③ 通用外壳 -->
<script>
const $ = (id) => document.getElementById(id)
function field(label, v, pv) {
  return `<div class="f${pv !== undefined && String(v) !== String(pv) ? ' changed' : ''}"><b>${label}</b>${v ?? '—'}</div>`
}
let state, prev, tab = 0, step = 0
function dispatch(action) { prev = state; state = Model.reduce(state, action); paint() }
function reset() { state = Model.init(); prev = state; step = 0; paint() }
function paint() {
  $('state').innerHTML = VIEW(state, prev)
  $('note').innerHTML = state.note ? `刚刚发生：${state.note}` : '点击下方任意按钮开始。蓝框 = 这一步发生变化的字段。'
  const sc = SCENARIOS[tab]
  $('tabs').innerHTML = SCENARIOS.map((s, i) => `<button data-tab="${i}" class="${i === tab ? 'on' : ''}">${s.name}</button>`).join('')
  $('desc').innerHTML = sc.desc
  $('steps').innerHTML = sc.steps.map((s, i) => `<button data-step="${i}" class="${i < step ? 'done' : i === step ? 'next' : ''}" ${i === step ? '' : 'disabled'}>${i + 1}. ${s.label}</button>`).join('') +
    (step >= sc.steps.length ? '<p class="ok">✓ 演练完成。可以切换其他场景，或继续自由试玩。</p>' : '')
}
$('free').innerHTML = ACTIONS.map((a, i) => `<button data-free="${i}">${a.label}</button>`).join('')
$('reset').onclick = reset
document.addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) return
  if (b.dataset.free) dispatch(ACTIONS[b.dataset.free].action)
  if (b.dataset.tab) { tab = +b.dataset.tab; reset() }
  if (b.dataset.step) { const s = SCENARIOS[tab].steps[step++]; dispatch(s.action) }
})
reset()
</script>
</body>
</html>
