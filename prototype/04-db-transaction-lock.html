<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>原型 04 · 事务、乐观锁与软删除</title>
<style>
:root{--a:#2563eb;--bg:#f7f7f8;--fg:#1f2328;--mut:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:900px;margin:0 auto;padding:24px 16px 64px}
a{color:var(--a)}
h1{margin:8px 0 6px;font-size:24px}
h2{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);letter-spacing:.05em;margin:0 0 10px}
h2 button{margin:0 0 0 auto}
.q{color:var(--mut);margin:4px 0}
section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:10px}
.f{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.f b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.changed{border-color:var(--a)!important;background:#eff6ff}
.note{margin:12px 0 0;padding:8px 12px;border-left:3px solid var(--a);background:#f8fafc}
button{font:inherit;font-size:14px;padding:6px 12px;margin:0 6px 6px 0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
button:hover:not(:disabled){border-color:var(--a);color:var(--a)}
button:disabled{opacity:.4;cursor:default}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a)}
.steps button.next{border-color:var(--a);color:var(--a);font-weight:600}
.steps button.done{text-decoration:line-through}
.ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#b45309}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
th{color:var(--mut);font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<main>
  <a href="index.html">← 全部原型</a>
  <h1>第四讲 · 事务、乐观锁与软删除</h1>
  <p class="q"><b>要回答的问题：</b>"创建项目 + 3 个默认任务"失败时，数据库里会不会留下半截数据？两个人同时改同一个任务，<code>WHERE version = ?</code> 能否保证后提交的人不会悄悄覆盖前一个人？软删除后"应用看到的"和"表里实际存在的"有什么区别？</p>
  <p class="q">PROTOTYPE · 一次性演示，数据库是内存里的两张表。对应真实实现见 <code>demos/04-database</code>。</p>

  <section><h2>当前状态</h2><div id="state"></div><p class="note" id="note"></p></section>
  <section><h2>自由试玩 <button id="reset">重置</button></h2><div id="free"></div></section>
  <section><h2>引导式演练</h2><div class="tabs" id="tabs"></div><p id="desc"></p><div class="steps" id="steps"></div></section>
</main>

<!-- ① 纯逻辑模块 -->
<script>
const DbModel = {
  init: () => ({
    projects: [{ id: 'P1', name: '官网改版', deletedAt: null }],
    tasks: [{ id: 'T1', projectId: 'P1', title: '设计稿评审', status: '待办', version: 1 }],
    tx: null, // { projects: [], tasks: [] } —— 只在事务内可见的写入
    sessions: { alice: null, bob: null }, // 各自读到的任务快照
    seq: 1,
    note: ''
  }),

  reduce(state, a) {
    const s = structuredClone(state)
    const say = (note) => ((s.note = note), s)
    switch (a.type) {
      case 'begin':
        if (s.tx) return say('❌ 已经在事务中')
        s.tx = { projects: [], tasks: [] }
        return say('BEGIN：开启事务，之后的写入别人看不到')
      case 'txProject':
        if (!s.tx) return say('❌ 请先开启事务')
        s.tx.projects.push({ id: `P${++s.seq}`, name: '新项目', deletedAt: null })
        return say(`INSERT project → P${s.seq}（仅事务内可见）`)
      case 'txTasks': {
        if (!s.tx?.projects.length) return say('❌ 事务里还没有项目')
        const pid = s.tx.projects.at(-1).id
        for (const title of ['计划', '执行', '复盘']) s.tx.tasks.push({ id: `T${pid}-${title}`, projectId: pid, title, status: '待办', version: 1 })
        return say('INSERT 3 个默认任务（仅事务内可见）')
      }
      case 'commit':
        if (!s.tx) return say('❌ 没有进行中的事务')
        s.projects.push(...s.tx.projects)
        s.tasks.push(...s.tx.tasks)
        s.tx = null
        return say('COMMIT：项目和任务一起生效')
      case 'fail':
        if (!s.tx) return say('❌ 没有进行中的事务')
        s.tx = null
        return say('💥 中途出错 → ROLLBACK：事务内的所有写入全部丢弃，表里没有半截数据')

      case 'read': {
        const t = s.tasks.find((t) => t.id === 'T1')
        s.sessions[a.who] = { status: t.status, version: t.version }
        return say(`${NAME[a.who]} 打开任务，读到 version = ${t.version}`)
      }
      case 'write': {
        const snap = s.sessions[a.who]
        if (!snap) return say(`❌ ${NAME[a.who]} 还没读取任务`)
        const t = s.tasks.find((t) => t.id === 'T1')
        // UPDATE tasks SET status = ?, version = version + 1 WHERE id = 'T1' AND version = ?
        if (t.version !== snap.version) {
          return say(`⚠️ ${NAME[a.who]} 提交「${a.status}」失败：WHERE version = ${snap.version} 影响 0 行（当前已是 v${t.version}），提示"任务已被他人修改，请刷新"`)
        }
        t.status = a.status
        t.version++
        s.sessions[a.who] = null
        return say(`${NAME[a.who]} 提交「${a.status}」成功，version → ${t.version}`)
      }
      case 'softDelete': {
        const p = s.projects.find((p) => p.id === 'P1')
        if (p.deletedAt) return say('P1 已经删除过了')
        p.deletedAt = '刚刚'
        return say('UPDATE projects SET deleted_at = now()：记录还在，只是打了标记')
      }
      case 'restore': {
        const p = s.projects.find((p) => p.id === 'P1')
        p.deletedAt = null
        return say('恢复：清空 deleted_at，项目回来了——这正是软删除的价值')
      }
    }
    return state
  },

  /** 应用层查询永远带 deleted_at IS NULL */
  visibleProjects: (s) => s.projects.filter((p) => !p.deletedAt)
}
const NAME = { alice: 'Alice', bob: 'Bob' }
const Model = DbModel
</script>

<!-- ② 页面配置 -->
<script>
const ACTIONS = [
  { label: '开启事务', action: { type: 'begin' } },
  { label: '事务内：创建项目', action: { type: 'txProject' } },
  { label: '事务内：创建 3 个默认任务', action: { type: 'txTasks' } },
  { label: '提交事务', action: { type: 'commit' } },
  { label: '模拟出错', action: { type: 'fail' } },
  { label: 'Alice 打开任务 T1', action: { type: 'read', who: 'alice' } },
  { label: 'Bob 打开任务 T1', action: { type: 'read', who: 'bob' } },
  { label: 'Alice 改为「进行中」', action: { type: 'write', who: 'alice', status: '进行中' } },
  { label: 'Bob 改为「已完成」', action: { type: 'write', who: 'bob', status: '已完成' } },
  { label: '软删除项目 P1', action: { type: 'softDelete' } },
  { label: '恢复项目 P1', action: { type: 'restore' } }
]
const A = Object.fromEntries(ACTIONS.map((a) => [a.label, a.action]))
const SCENARIOS = [
  { name: '事务提交', desc: '项目和默认任务在事务里依次写入，提交前"应用看到的表"没有变化，提交后一起出现。', steps: ['开启事务', '事务内：创建项目', '事务内：创建 3 个默认任务', '提交事务'] },
  { name: '事务回滚', desc: '项目已经插入、任务也插入了，最后一步出错。回滚后表里没有任何残留——不会出现"有项目没任务"的半截数据。', steps: ['开启事务', '事务内：创建项目', '事务内：创建 3 个默认任务', '模拟出错'] },
  {
    name: '乐观锁冲突',
    desc: 'Alice 和 Bob 同时打开任务，都读到 version = 1。Alice 先提交成功，version 变成 2。Bob 带着 version = 1 提交，更新影响 0 行——他的修改被拦下，而不是悄悄覆盖 Alice 的。Bob 刷新后再提交即可成功。',
    steps: ['Alice 打开任务 T1', 'Bob 打开任务 T1', 'Alice 改为「进行中」', 'Bob 改为「已完成」', 'Bob 打开任务 T1', 'Bob 改为「已完成」']
  },
  { name: '软删除', desc: '删除后应用查不到 P1，但原始表里它还在，随时可以恢复，也方便审计。', steps: ['软删除项目 P1', '恢复项目 P1'] }
].map((s) => ({ ...s, steps: s.steps.map((label) => ({ label, action: A[label] })) }))

const snap = (v) => (v ? `读到「${v.status}」v${v.version}` : '未打开')
function VIEW(s, p) {
  const T1 = s.tasks.find((t) => t.id === 'T1')
  const pT1 = p.tasks.find((t) => t.id === 'T1')
  return `<div class="grid">
    ${field('应用看到的项目（deleted_at IS NULL）', Model.visibleProjects(s).map((x) => x.id).join('、') || '无', Model.visibleProjects(p).map((x) => x.id).join('、') || '无')}
    ${field('未提交的事务', s.tx ? `${s.tx.projects.length} 个项目 / ${s.tx.tasks.length} 个任务` : '无', p.tx ? `${p.tx.projects.length} 个项目 / ${p.tx.tasks.length} 个任务` : '无')}
    ${field('任务 T1（数据库）', `「${T1.status}」v${T1.version}`, `「${pT1.status}」v${pT1.version}`)}
    ${field('Alice 的页面', snap(s.sessions.alice), snap(p.sessions.alice))}
    ${field('Bob 的页面', snap(s.sessions.bob), snap(p.sessions.bob))}
  </div>
  <div class="cols">
    <table><tr><th colspan="3">projects 原始表</th></tr>
      ${s.projects.map((x) => `<tr><td>${x.id}</td><td>${x.name}</td><td>${x.deletedAt ? `<span class="warn">deleted_at = ${x.deletedAt}</span>` : '—'}</td></tr>`).join('')}
    </table>
    <table><tr><th colspan="3">tasks 原始表</th></tr>
      ${s.tasks.map((x) => `<tr><td>${x.projectId}</td><td>${x.title}</td><td>${x.status} · v${x.version}</td></tr>`).join('')}
    </table>
  </div>`
}
</script>

<!-- ③ 通用外壳 -->
<script>
const $ = (id) => document.getElementById(id)
function field(label, v, pv) {
  return `<div class="f${pv !== undefined && String(v) !== String(pv) ? ' changed' : ''}"><b>${label}</b>${v ?? '—'}</div>`
}
let state, prev, tab = 0, step = 0
function dispatch(action) { prev = state; state = Model.reduce(state, action); paint() }
function reset() { state = Model.init(); prev = state; step = 0; paint() }
function paint() {
  $('state').innerHTML = VIEW(state, prev)
  $('note').innerHTML = state.note ? `刚刚发生：${state.note}` : '点击下方任意按钮开始。蓝框 = 这一步发生变化的字段。'
  const sc = SCENARIOS[tab]
  $('tabs').innerHTML = SCENARIOS.map((s, i) => `<button data-tab="${i}" class="${i === tab ? 'on' : ''}">${s.name}</button>`).join('')
  $('desc').innerHTML = sc.desc
  $('steps').innerHTML = sc.steps.map((s, i) => `<button data-step="${i}" class="${i < step ? 'done' : i === step ? 'next' : ''}" ${i === step ? '' : 'disabled'}>${i + 1}. ${s.label}</button>`).join('') +
    (step >= sc.steps.length ? '<p class="ok">✓ 演练完成。可以切换其他场景，或继续自由试玩。</p>' : '')
}
$('free').innerHTML = ACTIONS.map((a, i) => `<button data-free="${i}">${a.label}</button>`).join('')
$('reset').onclick = reset
document.addEventListener('click', (e) => {
  const b = e.target.closest('button')
  if (!b) return
  if (b.dataset.free) dispatch(ACTIONS[b.dataset.free].action)
  if (b.dataset.tab) { tab = +b.dataset.tab; reset() }
  if (b.dataset.step) { const s = SCENARIOS[tab].steps[step++]; dispatch(s.action) }
})
reset()
</script>
</body>
</html>
